name: mapstothestars

services:
  web:
    # Reuse the image already installed for the server's shared HTTPS proxy.
    image: caddy:2-alpine
    pull_policy: never
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    # The upstream Caddy binary carries this file capability, even on port 8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    tmpfs:
      - /tmp:size=8m,mode=1777
    volumes:
      - ${STARS_DIST:-../dist}:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      shared:
        aliases: [mapstothestars]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"

networks:
  shared:
    external: true
    # Docker network of the existing reverse proxy, e.g. "myproxy_default".
    name: ${STARS_PROXY_NETWORK:?Set STARS_PROXY_NETWORK to the shared proxy network}
