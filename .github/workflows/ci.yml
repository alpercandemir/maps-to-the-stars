name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full main-branch commit SHA to deploy (blank uses the current commit; older SHA rolls back)
        required: false
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select and validate revision
        id: revision
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ -n "$REQUESTED_COMMIT" ]]; then
            [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Use a full 40-character commit SHA.' >&2; exit 1; }
            git merge-base --is-ancestor "$REQUESTED_COMMIT" origin/main
            git checkout --detach "$REQUESTED_COMMIT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check deployment scripts and configuration
        run: |
          bash -n deploy/*.sh
          STARS_PROXY_NETWORK=ci docker compose -f deploy/compose.yaml config --quiet
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Package the tested release
        run: tar -czf site.tar.gz dist deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ steps.revision.outputs.sha }}
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: production
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://tothestars.138.2.168.194.sslip.io
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Skip superseded automatic deployments
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.ci.outputs.sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$GITHUB_EVENT_NAME" == push && "$latest" != "$TARGET_SHA" ]]; then
            echo 'A newer main commit exists; skipping this deployment.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.deploy == 'true'
        with:
          name: site-${{ needs.ci.outputs.sha }}
      - name: Unpack the tested deployment helpers
        if: steps.current.outputs.deploy == 'true'
        run: tar -xzf site.tar.gz deploy
      - name: Deploy and verify HTTPS
        if: steps.current.outputs.deploy == 'true'
        env:
          STARS_DEPLOY_HOST: ${{ vars.STARS_DEPLOY_HOST }}
          STARS_DEPLOY_USER: ${{ vars.STARS_DEPLOY_USER }}
          STARS_KNOWN_HOSTS: ${{ vars.STARS_KNOWN_HOSTS }}
          STARS_PUBLIC_URL: https://tothestars.138.2.168.194.sslip.io
          STARS_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          STARS_RELEASE_ID: ${{ needs.ci.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/ship.sh site.tar.gz
